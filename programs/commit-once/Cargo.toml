[package]
name = "commit-once"
version = "0.1.0"
description = "Onchain idempotency keys for Solana: at-most-once execution of a logical intent"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository = "https://github.com/commitonce-dev/commitonce"
keywords = ["solana", "idempotency", "anchor", "reliability"]

[lib]
crate-type = ["cdylib", "lib"]
name = "commit_once"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
# Official Instructions-sysvar reader, used to detect durable-nonce transactions.
# Pinned to the same major version anchor-lang 1.2.0 already depends on so cargo
# unifies to a single copy.
solana-instructions-sysvar = "3.0.0"

[dev-dependencies]
litesvm = "0.16.0"
sha2 = "0.10"
solana-account = "4.3.0"
solana-address-lookup-table-interface = { version = "~3.1.0", features = ["bincode"] }
solana-clock = "~3.1.1"
solana-hash = "~4.5.0"
solana-instruction = "~3.4.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-pubkey = "4"
solana-rent = "~4.3.0"
solana-signer = "3.0.1"
solana-system-interface = "3"
solana-transaction = "4"
solana-transaction-error = "3.3.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
